- module-name: "minecraftlauncher.constants"
  variables:
    setup_code: 
      - "import tomllib"
      - "import os"
      - "f = open('./pyproject.toml', 'r')"
      - "pt = tomllib.loads(f.read())"
      - "version = pt['project']['version']"
      - "azure_client_id = os.environ.get('AZURE_CLIENT_ID')"
    declarations:
      "version": "version"
      "azure_client_id": "azure_client_id"
  anti-bloat:
    - description: "Override \"dev\" in LAUNCHER_VERSION with actual version"
      replacements:
        'LAUNCHER_VERSION = "dev"': '"LAUNCHER_VERSION = %r" % get_variable("version")'
    - description: "Override 'DEV' constant and remove runtime calculation"
      replacements_plain:
        'DEV = not bool(globals().get("__compiled__", False))': "DEV = False"
    - description: "Replace Azure client ID when it's provided"
      replacements:
        'AZURE_CLIENT_ID = os.environ.get("AZURE_CLIENT_ID", DEFAULT_CLIENT_ID)': '"AZURE_CLIENT_ID = %r" % get_variable("azure_client_id")'
      when: "get_variable('azure_client_id') is not None"
- module-name: "minecraftlauncher.auth.encryption"
  variables:
    setup_code:
      - "import platform"
      - "match platform.system():"
      - " case 'Windows':"
      - "   ENABLED = True"
      - "   PREFIX = 'win32'"
      - " case 'Linux':" # this won't be used but the compiler will throw a tantrum otherwise, probably
      - "   ENABLED = False"
      - "   PREFIX = 'linux'"
      - " case _:"
      - "   ENABLED = False"
      - "   PREFIX = 'no'"
    declarations:
      "prefix": "PREFIX"
      "enabled": "ENABLED"
  anti-bloat:
    - description: "Remove runtime OS/import calculations on non-Linux"
      change_function:
        "run_import": "un-callable"
      replacements_plain:
        "\nrun_import()": ""
      when: "not linux"
    - description: "Remove runtime OS/import calculations on non-Linux (pt2)"
      append_result:
        '"from .%s_encryption import encrypt, decrypt, data_load_hook, data_save_hook" % get_variable("prefix")'
      when: "not linux"
    - description: "Remove runtime OS/import calculations on non-Linux (pt3)"
      append_result:
        '"ENABLED = %s" % get_variable("enabled")'
      when: "not linux"
- module-name: "minecraftlauncher.back.java_manager"
  anti-bloat:
    - description: "Remove executable mark function code on win32"
      change_function:
        "mark_executable": "'(lambda: True)'"
      when: "win32"