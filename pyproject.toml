[project]
name = "PymLauncher"
version = "1.0.2.1"
requires-python = ">= 3.15"

[tool]

[tool.black]
line-length = 79
extend-exclude = "_resources_bundled.py"

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "All"
exclude = [
    "**/__pycache__",
    "**/dist",
    "**/.pytest_cache",
    "**/.venv",
]

[tool.nuitka]
mode = "standalone"
enable-plugin = "pyside6"
include-qt-plugins = ["sensible", "qml"]

[tool.pytest]
testpaths = ["tests"]

[tool.isort]
line_length = 79
profile = "black"
from_first = true

[tool.pyrefly]
project-excludes = [
    "**/__pycache__",
    "**/dist",
    "**/.pytest_cache",
]
python-platform = "all"
python-version = "3.14.0"
infer-with-first-use = false
