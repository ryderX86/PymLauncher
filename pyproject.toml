[project]
name = "MinecraftLauncher-py"
version = "1.0.0.31"
requires-python = ">= 3.13"

[tool]

[tool.black]
line-length = 79
extend-exclude = "_resources_bundled.py"

[tool.pyright]
pythonPlatform = "All"

[tool.nuitka]
mode = "standalone"
enable-plugin = "pyside6"
include-qt-plugins = ["sensible", "qml"]

[tool.pytest]
testpaths = ["tests"]